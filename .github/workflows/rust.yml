name: Rust and Tauri

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'crates/**'
      - 'plugins/**'
      - 'src-tauri/**'
      - 'ui/**'
      - 'remote/**'
      - 'scripts/**'
      - 'spicetify/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'crates/**'
      - 'plugins/**'
      - 'src-tauri/**'
      - 'ui/**'
      - 'remote/**'
      - 'scripts/**'
      - 'spicetify/**'
      - '.github/workflows/rust.yml'

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test framework-independent core
        run: cargo test -p track-mirror-core

  tauri-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Generate CI-only Tauri icon for Rust typechecking
        run: |
          python3 - <<'PY'
          # The current repo does not yet contain its production Tauri icon.
          # Generate a disposable valid RGBA PNG so macro expansion can check
          # Rust code. This file exists only on the CI runner and is NOT
          # committed or intended for packaging/release.
          import pathlib
          import struct
          import zlib

          def chunk(kind: bytes, data: bytes) -> bytes:
              return (struct.pack(">I", len(data)) + kind + data
                      + struct.pack(">I", zlib.crc32(kind + data) & 0xFFFFFFFF))

          width = height = 64
          rgba = bytes([80, 80, 80, 255])
          raw = (b"\\x00" + rgba * width) * height
          png = (b"\\x89PNG\\r\\n\\x1a\\n"
                 + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(raw))
                 + chunk(b"IEND", b""))
          dest = pathlib.Path("src-tauri/icons/icon.png")
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_bytes(png)
          print(f"CI-only icon generated at {dest}")
          PY
      - name: Check Tauri shell and playback plugin Rust bridge
        run: cargo check -p track-mirror-app

  remote-bridge-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check remote bridge scripts
        run: |
          python3 -m py_compile scripts/track-mirror-remote-server.py
          node --check spicetify/track-mirror-remote-bridge.js
          python3 -m unittest discover -s tests -p 'test_remote_event_pipeline.py' -v
          node tests/test_spicetify_visible_event_bridge.cjs
          bash -n \
            scripts/track-mirror-launch.sh \
            scripts/track-mirror-remote-info.sh \
            scripts/install-desktop-launcher.sh \
            scripts/install-track-mirror.sh \
            scripts/restore-spotify.sh
