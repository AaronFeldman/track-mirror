name: Rust and Tauri

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'crates/**'
      - 'plugins/**'
      - 'src-tauri/**'
      - 'ui/**'
      - 'remote/**'
      - 'scripts/**'
      - 'spicetify/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'crates/**'
      - 'plugins/**'
      - 'src-tauri/**'
      - 'ui/**'
      - 'remote/**'
      - 'scripts/**'
      - 'spicetify/**'
      - '.github/workflows/rust.yml'

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test framework-independent core
        run: cargo test -p track-mirror-core

  tauri-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Check Tauri shell and playback plugin Rust bridge
        run: cargo check -p track-mirror-app

  remote-bridge-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check remote bridge scripts
        run: |
          python3 -m py_compile scripts/track-mirror-remote-server.py
          node --check spicetify/track-mirror-remote-bridge.js
          bash -n \
            scripts/track-mirror-launch.sh \
            scripts/track-mirror-remote-info.sh \
            scripts/install-desktop-launcher.sh \
            scripts/install-track-mirror.sh \
            scripts/restore-spotify.sh
