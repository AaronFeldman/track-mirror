name: Rust and Tauri

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'crates/**'
      - 'src-tauri/**'
      - 'ui/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'crates/**'
      - 'src-tauri/**'
      - 'ui/**'
      - '.github/workflows/rust.yml'

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test framework-independent core
        run: cargo test -p track-mirror-core

  tauri-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Check Tauri shell
        run: cargo check -p track-mirror-app
